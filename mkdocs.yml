site_name: Terra Viva — Mário Lago
site_description: Memória, orientação e qualificação documental do Coletivo Terra Viva
site_url: https://takwaratec.github.io/plataforma-juventude-solidaria-2026/
repo_name: takwaratec/plataforma-juventude-solidaria-2026
repo_url: https://github.com/takwaratec/plataforma-juventude-solidaria-2026
edit_uri: ""
copyright: "© Coletivo Terra Viva, 2026 · Organização documental e infraestrutura digital: Tecnologia Takwara"

theme:
  name: material
  language: pt-BR
  logo: assets/images/terra_viva.png
  favicon: assets/images/terra_viva.png
  palette:
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo escuro
  features:
    - navigation.tracking
    - navigation.top
    - search.highlight

extra:
  generator: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

plugins:
  - search

exclude_docs: |
  PROPOSTA_GABARITO_JUVENTUDE_SOLIDARIA.md
  acervo-digitalizado.md
  analise-propostas.md
  boletim_sentinel_editais_2026.md
  documentos_administrativos/**
  documentos_projeto/**
  editais/**
  historia.md
  projetos/**
  territorio.md

nav:
  - Início: index.md
  - Histórico: historico-consolidado.md
  - Governança: governanca-colaboracao.md
  - Plano de apoio:
      - Roteiro geral: roteiro-apoio-concreto.md
      - App de triagem documental: app-triagem-regularizacao.md
  - Zayed 2027: zayed-award-2027.md
  - Referências:
      - Acervo científico: https://takwaratec.github.io/acervo-soberania-tecnologica/analyses/reforma-agraria-agrofloresta/
      - ECOSALA: https://takwaratec.github.io/ECOSALA/territorios/reforma-agraria-agrofloresta/
